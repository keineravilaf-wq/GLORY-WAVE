name: Build

# Every push to master and every pull request gets an APK, so a change can be
# tried on a phone without building it by hand. No signing secrets here: with
# no keystore the build signs with the debug key, and GitHub does not hand
# secrets to pull requests from forks anyway.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Heaven Sound: if heaven.zip is in the repository's root, its files are
      # laid over the project before it is built. To change the app, upload a
      # new heaven.zip; nothing else needs touching.
      - name: Apply Heaven Sound changes
        run: |
          if [ -f heaven.zip ]; then
            unzip -o heaven.zip -x "__MACOSX/*"
          else
            echo "No heaven.zip: building the project as it is."
          fi

      - uses: ./.github/actions/setup

      - name: Build
        run: ./gradlew :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: heaven-sound-${{ github.sha }}
          path: app/build/outputs/apk/dev/app-universal-dev.apk
          retention-days: 14
          if-no-files-found: error
